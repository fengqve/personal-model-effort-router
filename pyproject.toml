[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-model-effort-router"
version = "0.2.0"
description = "Agent-first model and reasoning-effort routing from personal preferences and task outcomes."
requires-python = ">=3.9"
license = {text = "MIT"}
readme = "README.md"
dependencies = []

[project.scripts]
model-effort-router = "model_effort_router.cli:main"

[tool.setuptools.packages.find]
where = ["skills/route-model-effort/scripts"]
include = ["model_effort_router*"]
