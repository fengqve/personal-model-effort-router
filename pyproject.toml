[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fitmytask"
version = "0.1.0"
description = "Choose model and reasoning effort from your own task evidence."
requires-python = ">=3.9"
license = {text = "MIT"}
readme = "README.md"
dependencies = []

[project.scripts]
fitmytask = "fitmytask.cli:main"

[tool.setuptools.packages.find]
include = ["fitmytask*"]
